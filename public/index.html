<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>Smart Home</title></head><body style="background:#0b0d10;color:white;font-family:system-ui"><p style="padding:24px">Loading Smart Home Dashboard…</p><script>(async()=>{async function inflate(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("Could not load "+url);const b=Uint8Array.from(atob((await r.text()).trim()),c=>c.charCodeAt(0));return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();}try{const [html,css]=await Promise.all([inflate("/index-v233.payload.b64"),inflate("/styles-v233.payload.b64")]);document.open();document.write(html.replace(/<link[^>]+styles\.css[^>]*>/i,""));document.close();const style=document.createElement("style");style.textContent=css;document.head.appendChild(style);}catch(e){document.body.innerHTML='<div style="padding:24px">Dashboard failed to load: '+e.message+'</div>';}})();</script></body></html>
